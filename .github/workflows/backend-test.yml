
name: Backend CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  push:
    branches:
      - master
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    # PostgreSQL service container
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: chatapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/chatapp_test
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_for_ci
      LOG_LEVEL: error

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies (root)
        run: yarn install --frozen-lockfile
        working-directory: .

      # - name: Install dependencies (backend)
      #   run: yarn install --frozen-lockfile
      #   working-directory: backend

      - name: Generate Prisma Client
        run: yarn prisma:generate
        working-directory: backend

      - name: Run Prisma migrations
        run: yarn prisma migrate deploy
        working-directory: backend

      - name: Run tests with coverage
        run: yarn coverage
        working-directory: backend

      - name: Check coverage thresholds
        run: |
          echo "Coverage thresholds are enforced by Vitest config (90% for all metrics)"
          if [ $? -ne 0 ]; then
            echo "❌ Tests failed or coverage thresholds not met"
            exit 1
          else
            echo "✅ All tests passed and coverage thresholds met"
          fi